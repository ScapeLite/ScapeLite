<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScapeLite Roadmap</title>
<meta name="color-scheme" content="dark light">
<style>
/* ScapeLite roadmap: local project management page. Tokens follow docs/DESIGN-SYSTEM.md (dark ScapeLite look, light variant). */
:root{--bg:#10101a;--bg2:#161620;--bg3:#1c1c28;--hover:#262636;--sunk:#0a0a12;--border:#2e2e42;--border2:#4a4a62;--text:#dcdce8;--dim:#8f8fa4;--faint:#7c7c93;
--accent:#ffd24a;--accent-bg:#2a2518;--accent-ink:#241a00;--good:#5fe06d;--warn:#ffb84a;--bad:#ff8a5c;--info:#4aa8ff;--magic:#b07cff;--scrim:rgba(6,6,12,.62);
--sh-pop:0 8px 24px rgba(0,0,0,.45);--r:12px;--r-sm:8px;--r-xs:5px;--dur:140ms;--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f4f8;--bg2:#fff;--bg3:#eeeef5;--hover:#e4e4ee;--sunk:#e6e6ef;--border:#d3d3e0;--border2:#a9a9bf;--text:#1d1d2b;--dim:#5d5d72;--faint:#6b6b80;
--accent:#9a6b00;--accent-bg:#fff2c9;--accent-ink:#fff;--good:#1a7f32;--warn:#9a5b00;--bad:#b8431a;--info:#1565b0;--magic:#7c3fc7;--scrim:rgba(30,30,50,.35);--sh-pop:0 8px 24px rgba(30,30,60,.18)}}
:root[data-theme="light"]{--bg:#f4f4f8;--bg2:#fff;--bg3:#eeeef5;--hover:#e4e4ee;--sunk:#e6e6ef;--border:#d3d3e0;--border2:#a9a9bf;--text:#1d1d2b;--dim:#5d5d72;--faint:#6b6b80;
--accent:#9a6b00;--accent-bg:#fff2c9;--accent-ink:#fff;--good:#1a7f32;--warn:#9a5b00;--bad:#b8431a;--info:#1565b0;--magic:#7c3fc7;--scrim:rgba(30,30,50,.35);--sh-pop:0 8px 24px rgba(30,30,60,.18)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- header ---- */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1700px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand img{width:24px;height:24px}
.brand small{font-weight:400;color:var(--dim);font-size:12px}
.sp{flex:1}
.field{display:flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--border);border-radius:var(--r-sm);padding:0 10px;height:34px;transition:border-color var(--dur)}
.field:focus-within{border-color:var(--info)}
.field input,.field select{background:none;border:0;outline:0;min-width:0;height:100%;color:var(--text)}
.field select{cursor:pointer;color:var(--dim)}
.field select option{background:var(--bg2);color:var(--text)}
.field kbd{font-size:11px;color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:0 5px}
.search{width:min(320px,34vw)}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--border);background:var(--bg3);border-radius:var(--r-sm);transition:background var(--dur),border-color var(--dur),transform var(--dur)}
.btn:hover{background:var(--hover);border-color:var(--border2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ico{padding:0;width:34px;justify-content:center}
.btn.sm{height:26px;padding:0 8px;font-size:12px;border-radius:6px}
.btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.saved{font-size:12px;color:var(--faint);min-width:74px;text-align:right}
.saved.err{color:var(--bad)}
.tabs{display:flex;gap:2px;padding:0 16px;max-width:1700px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:9px 12px 11px;background:none;border:0;border-radius:var(--r-sm) var(--r-sm) 0 0;color:var(--dim);white-space:nowrap;transition:color var(--dur),background var(--dur)}
.tab:hover{background:var(--bg2);color:var(--text)}
.tab[aria-selected=true]{color:var(--text);background:var(--bg2)}
.tab .n{font-size:11px;background:var(--bg3);border-radius:99px;padding:0 7px;color:var(--dim);font-variant-numeric:tabular-nums}
.tab .pg{position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;background:var(--sunk);overflow:hidden}
.tab .pg i{display:block;height:100%;background:var(--good);transition:width .5s var(--ease)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.tab.dropt{background:var(--accent-bg);color:var(--accent);outline:1px dashed var(--accent)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px 10px;max-width:1700px;margin:0 auto;border-top:1px solid var(--border);background:var(--bg)}
.quick{flex:1 1 360px;max-width:640px}
.filt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.quick input{flex:1}
.chips{display:flex;gap:4px}
.chip{height:26px;padding:0 10px;border:1px solid var(--border);background:transparent;border-radius:99px;font-size:12px;color:var(--dim);transition:all var(--dur)}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

/* ---- main ---- */
main{max-width:1700px;margin:0 auto;padding:16px 16px 110px}
.ttl{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.ttl h2{margin:0;font-size:20px}
.ttl p{margin:0;color:var(--dim);font-size:13px}
.bigbar{flex:1 1 280px;max-width:520px}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.prog i{display:block;height:100%;transition:width .6s var(--ease)}
.prog .g{background:var(--good)}.prog .a{background:var(--accent)}
.plab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:4px;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:minmax(260px,1.05fr) repeat(3,minmax(240px,1fr));gap:12px;align-items:start}
.grp{display:contents}
.col{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;transition:border-color var(--dur),background var(--dur)}
.col.idea{border-style:dashed;background:transparent}
.col.over{border-color:var(--accent);background:var(--accent-bg)}
.col>header{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.col>header h3{margin:0;font-size:13px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.col>header h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.col.doing h3 .dot{background:var(--accent)}.col.planned h3 .dot{background:var(--info)}.col.done h3 .dot{background:var(--good)}.col.idea h3 .dot{background:var(--magic)}
.col>header .n{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.col>header .hint{font-size:11px;color:var(--faint);margin-left:2px}
.lst{display:flex;flex-direction:column;gap:8px;padding:6px 10px 10px;min-height:76px}
.lst.scroll{max-height:calc(100vh - 260px);overflow-y:auto;scrollbar-width:thin}
.card{position:relative;background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:var(--r-sm);padding:9px 10px 8px;transition:border-color var(--dur),background var(--dur),box-shadow var(--dur),opacity var(--dur);animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card:hover{background:var(--hover);border-color:var(--border2)}
.card[data-p=P1]{border-left-color:var(--bad)}.card[data-p=P2]{border-left-color:var(--warn)}.card[data-p=P3]{border-left-color:var(--info)}
.card.sel{outline:2px solid var(--accent);outline-offset:-1px}
.card.dragging{opacity:.4}
.card.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.card.db{box-shadow:0 -3px 0 0 var(--accent)}.card.da{box-shadow:0 3px 0 0 var(--accent)}
.card.stale-done{opacity:.85}
.c-top{display:flex;gap:8px;align-items:flex-start}
.c-top input[type=checkbox]{margin:3px 0 0;accent-color:var(--accent);opacity:0;transition:opacity var(--dur);cursor:pointer}
.card:hover .c-top input,.card:focus-within .c-top input,.card.sel .c-top input,body.has-sel .c-top input{opacity:1}
.c-title{flex:1;font-weight:600;font-size:13.5px;line-height:1.35;word-break:break-word;cursor:pointer}
.c-title input{width:100%;background:var(--sunk);border:1px solid var(--info);border-radius:5px;padding:2px 6px;font-weight:600}
.pbadge{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;border:1px solid currentColor;margin-top:1px}
.pbadge.P1{color:var(--bad)}.pbadge.P2{color:var(--warn)}.pbadge.P3{color:var(--info)}
.c-notes{margin:4px 0 0 24px;color:var(--dim);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0 24px;align-items:center}
.tag{font-size:11px;padding:0 7px;border-radius:99px;background:var(--sunk);color:var(--dim);border:1px solid var(--border);white-space:nowrap;line-height:18px}
.tag.ms{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.tag.src{color:var(--magic);border-color:color-mix(in srgb,var(--magic) 40%,transparent)}
.tag.hold{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.tag.pub{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.tag.btn{height:auto;cursor:pointer}
.c-act{display:flex;gap:4px;margin:6px 0 0 24px;flex-wrap:wrap;max-height:0;overflow:hidden;opacity:0;transition:max-height var(--dur),opacity var(--dur)}
.card:hover .c-act,.card:focus-within .c-act,.card:focus .c-act{max-height:40px;opacity:1}
@media (hover:none){.c-act{max-height:40px;opacity:1}.c-top input{opacity:1}}
.c-act button{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);font-size:11.5px;color:var(--dim);transition:all var(--dur)}
.c-act button:hover{color:var(--text);border-color:var(--border2);background:var(--bg)}
.c-act button.go:hover{color:var(--good);border-color:var(--good)}
.c-act button.no:hover{color:var(--bad);border-color:var(--bad)}
.c-act .svg{display:inline-flex}
.c-reason{margin:4px 0 0 24px;font-size:12px;color:var(--bad)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--faint);font-size:12.5px;padding:18px 10px;border:1px dashed var(--border);border-radius:var(--r-sm)}
.empty svg{width:26px;height:26px;opacity:.6}
.add{margin:0 10px 10px;display:flex}
.add button{flex:1;height:30px;border:1px dashed var(--border);background:none;border-radius:var(--r-sm);color:var(--faint);font-size:12.5px;transition:all var(--dur)}
.add button:hover{border-color:var(--accent);color:var(--accent)}
.add input{flex:1;height:30px;border:1px solid var(--info);background:var(--sunk);border-radius:var(--r-sm);padding:0 10px}
.more{margin:0 10px 10px}
.wd{margin-top:14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r)}
.wd>summary{padding:10px 14px;cursor:pointer;color:var(--dim);font-size:13px}
.wd .lst{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.wd .col{border:0;background:none}
.seg{display:none}

/* ---- overview / public / changes ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.panel h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--dim);display:flex;align-items:center;gap:8px}
.acard{cursor:pointer;text-align:left;width:100%;transition:border-color var(--dur),transform var(--dur),background var(--dur)}
.acard:hover{border-color:var(--accent);transform:translateY(-1px)}
.acard h4{margin:0 0 2px;font-size:15px}.acard p{margin:0 0 10px;color:var(--dim);font-size:12.5px}
.counts{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--dim)}
.counts b{color:var(--text);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--dim);font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;transition:background var(--dur)}
.row:hover{background:var(--bg3)}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.row .a{color:var(--dim);font-size:12px}
.ms-row{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.ms-row b{font-variant-numeric:tabular-nums}
.pubwrap{max-width:820px;margin:0 auto}
.pub h3{margin:22px 0 8px;font-size:16px}
.pub h3 small{color:var(--dim);font-weight:400}
.pitem{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--info);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:border-color var(--dur)}
.pitem:hover{border-color:var(--border2)}
.pitem.doing{border-left-color:var(--accent)}.pitem.done{border-left-color:var(--good)}
.pitem p{margin:3px 0 0;color:var(--dim);font-size:13.5px}
.pitem .nos{font-style:italic;color:var(--faint)}
.pitem small{display:block;color:var(--faint);margin-top:3px}
.note{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;color:var(--dim);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chg h3{margin:18px 0 6px;font-size:14px}
.chg li{margin:3px 0}
.chg ul{margin:0;padding-left:20px}
.chg .ar{color:var(--faint);font-size:12px}

/* ---- drawer / modal / menu / toast ---- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--bg2);border-left:1px solid var(--border2);z-index:60;transform:translateX(102%);transition:transform .22s var(--ease);display:flex;flex-direction:column;box-shadow:var(--sh-pop)}
.drawer.open{transform:none}
.drawer>header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.drawer>header .id{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.drawer .body{padding:14px 16px 24px;overflow-y:auto;display:grid;gap:12px}
.lab{display:grid;gap:4px;font-size:12px;color:var(--dim)}
.lab>input,.lab>select,.lab>textarea{background:var(--sunk);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;color:var(--text);font-size:14px;width:100%}
.lab>input:focus,.lab>select:focus,.lab>textarea:focus{outline:0;border-color:var(--info)}
.lab textarea{min-height:130px;resize:vertical;font:13px/1.5 ui-monospace,Consolas,monospace}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stbtn{display:flex;gap:4px;flex-wrap:wrap}
.preview{background:var(--sunk);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;font-size:13.5px;color:var(--text)}
.preview p{margin:.3em 0}.preview ul{margin:.3em 0;padding-left:20px}.preview code{background:var(--bg3);padding:0 4px;border-radius:4px;font-size:12px}.preview h5{margin:.5em 0 .2em;font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:4px}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);box-shadow:var(--sh-pop);padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:16px}
.modal .act{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal table{border-collapse:collapse;width:100%;font-size:13px}.modal td{padding:3px 6px;border-bottom:1px solid var(--border)}.modal kbd{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:0 6px}
.menu{position:fixed;z-index:90;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--sh-pop);padding:4px;min-width:200px;animation:pop .14s var(--ease)}
.menu button{display:flex;width:100%;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;color:var(--text)}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.menu .h{font-size:11px;color:var(--faint);padding:6px 10px 2px;text-transform:uppercase}
.toasts{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:120;align-items:center;pointer-events:none}
.toast{background:var(--bg2);border:1px solid var(--border2);box-shadow:var(--sh-pop);border-radius:10px;padding:8px 12px;display:flex;gap:12px;align-items:center;pointer-events:auto;animation:pop .2s var(--ease)}
.toast button{background:none;border:0;color:var(--accent);font-weight:600;padding:0}
.bulk{position:fixed;left:50%;bottom:14px;transform:translate(-50%,140%);z-index:50;background:var(--bg2);border:1px solid var(--accent);border-radius:14px;box-shadow:var(--sh-pop);padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px);transition:transform .22s var(--ease)}
.bulk.show{transform:translate(-50%,0)}
.bulk b{padding:0 8px;font-variant-numeric:tabular-nums}
.fab{display:none}
body.dragging .c-act{display:none}
body.dragging .col{border-color:var(--border2)}

/* ---- responsive ---- */
@media (max-width:1180px){.board{grid-template-columns:1fr 1fr}.lst.scroll{max-height:none}}
@media (max-width:760px){
 .top{position:relative}.filt{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;padding-bottom:2px}.filt>*{flex:none}.quick{max-width:none;flex-basis:100%}
 .bar{flex-wrap:wrap;padding:8px 12px}.search{width:100%;order:9}.brand small{display:none}
 .tabs{padding:0 8px}.tools{padding:8px 12px}main{padding:12px 12px 120px}
 .board{grid-template-columns:1fr}
 .seg{display:flex;gap:4px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
 .seg button{flex:none}
 .board .col{display:none}.board[data-col=idea] .col.idea,.board[data-col=doing] .col.doing,.board[data-col=planned] .col.planned,.board[data-col=done] .col.done{display:flex}
 .f3{grid-template-columns:1fr 1fr}
 .fab{display:flex;position:fixed;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:var(--sh-pop);z-index:40}
 .bulk{bottom:78px}
 .saved{display:none}
}

<body>
<header class="top">
  <div class="bar">
    <div class="brand"><img src="/logo.svg" alt="" onerror="this.remove()"><span>ScapeLite Roadmap</span><small>local project board</small></div>
    <span class="sp"></span>
    <label class="field search" title="Search titles, notes, tags and ids ( / )">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search everything" aria-label="Search" autocomplete="off"><kbd>/</kbd>
    </label>
    <button class="btn ico" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="btn ico" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <span class="saved" id="saved" role="status" aria-live="polite"></span>
    <button class="btn ico" id="menu" title="More" aria-label="More" aria-haspopup="menu"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Areas"></nav>
  <div class="tools" id="tools">
    <label class="field quick" title="Quick add. Enter adds. Tail words: #tag  !1 !2 !3 (priority)  @planned @doing @done @idea (list)">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <input id="qa" placeholder="Quick add and press Enter (+ or n to focus)" aria-label="Quick add item" autocomplete="off">
      <select id="qaArea" aria-label="Area of the new item"></select>
    </label>
    <div class="filt"><span class="chips" id="fp" role="group" aria-label="Priority filter"></span>
    <label class="field"><select id="ftag" aria-label="Filter by tag"></select></label>
    <label class="field"><select id="fsrc" aria-label="Filter by source"></select></label>
    <label class="field"><select id="fms" aria-label="Filter by milestone"></select></label>
    <label class="field"><select id="sort" aria-label="Sort"><option value="manual">Manual order</option><option value="pri">Priority</option><option value="upd">Recently updated</option><option value="effort">Effort (small first)</option><option value="title">Title</option></select></label>
    <button class="btn sm" id="clearf" hidden>Clear filters</button></div>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<aside class="drawer" id="drawer" aria-label="Item details" aria-hidden="true"></aside>
<div class="bulk" id="bulk" role="toolbar" aria-label="Bulk actions"></div>
<button class="fab" id="fab" aria-label="Add item"><svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* ScapeLite roadmap page. Plain JS, no build. Data comes from GET/PUT /api/roadmap (roadmap/roadmap.json). Local only; never talks to the game. */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var IC = {
  plus: '<path d="M12 5v14M5 12h14"/>', check: '<path d="M5 12.5l4.5 4.5L19 7"/>', play: '<path d="M7 5l12 7-12 7z"/>', up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  bulb: '<path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  back: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>', eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  inbox: '<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>', rocket: '<path d="M5 15c-1 1-2 4-2 6 2 0 5-1 6-2M14 4c3-1 6-1 7-1 0 1 0 4-1 7l-6 6-5-5z"/><circle cx="15" cy="9" r="1.5"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>', trophy: '<path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M12 14v4M8 21h8"/>',
  ban: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>'
};
function ic(n, sz) { return '<svg class="i" viewBox="0 0 24 24"' + (sz ? ' style="width:' + sz + 'px;height:' + sz + 'px"' : '') + '>' + IC[n] + '</svg>'; }
function today() { var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem('sl-roadmap:' + k); localStorage.setItem('sl-roadmap:' + k, v); } catch (e) { return null; } }

var ST = ['idea', 'planned', 'doing', 'done', 'wontdo'];
var ST_LABEL = { idea: 'Ideas', planned: 'Planned', doing: 'Doing now', done: 'Done', wontdo: "Won't do" };
var ST_VERB = { idea: 'Back to ideas', planned: 'Promote to Planned', doing: 'Start', done: 'Done', wontdo: "Won't do" };
var S = { doc: null, tab: 'overview', q: '', fp: {}, ftag: '', fsrc: '', fms: '', sort: 'manual', sel: {}, detail: null, col: 'doing', undo: [], redo: [], flash: {}, more: {}, drag: null, saving: false, pending: false, lastArea: 'feat', chgBy: 'milestone', chgMs: '', prevMd: false, lastGroup: '', lastGroupT: 0 };
S.tab = store('tab') || 'overview'; S.sort = store('sort') || 'manual'; S.lastArea = store('area') || 'feat'; S.col = store('col') || 'doing';

/* ------------------------------ data ------------------------------ */
function api(method, url, body) {
  return fetch(url, { method: method, headers: { 'content-type': 'application/json', 'x-cc-control': '1' }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' })
    .then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
}
function load(first) {
  return fetch('/api/roadmap', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function (d) {
    S.doc = d; if (first) { if (S.tab !== 'overview' && S.tab !== 'public' && S.tab !== 'changes' && !areaById(S.tab)) S.tab = 'overview'; }
    setSaved('Loaded'); renderAll();
  }).catch(function (e) { $('#main').innerHTML = '<div class="empty"><b>Could not load the roadmap</b>' + esc(e.message) + '<br>Is the dashboard (or <code>npm run roadmap-server</code>) running?</div>'; setSaved('Offline', true); });
}
function areaById(id) { return S.doc.areas.filter(function (a) { return a.id === id; })[0]; }
function item(id) { return S.doc.items.filter(function (i) { return i.id === id; })[0]; }
function setSaved(t, err) { var e = $('#saved'); e.textContent = t; e.className = 'saved' + (err ? ' err' : ''); }
var saveT = null;
function scheduleSave() { setSaved('Saving...'); S.pending = true; clearTimeout(saveT); saveT = setTimeout(doSave, 250); }
function doSave() {
  if (S.saving) { S.pending = true; return; }
  S.saving = true; S.pending = false;
  api('PUT', '/api/roadmap', S.doc).then(function (r) {
    S.saving = false;
    if (r.ok) { S.doc.rev = r.rev; S.doc.updated = r.updated; if (S.pending) doSave(); else setSaved('Saved'); }
    else if (r._status === 409) { toast('The roadmap changed elsewhere (CLI or another tab). Reloaded the newest version; repeat your last change.'); S.pending = false; S.undo.pop(); load(); }
    else { setSaved('Not saved', true); toast('Save failed: ' + (r.error || r._status)); setTimeout(scheduleSave, 4000); }
  }).catch(function () { S.saving = false; setSaved('Offline', true); setTimeout(scheduleSave, 4000); });
}
function poll() {
  if (document.hidden || S.saving || S.pending || !S.doc) return;
  fetch('/api/roadmap', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    if (S.pending || S.saving || !S.doc) return;
    if (d.rev !== S.doc.rev) { S.doc = d; toast('Updated from disk (changed by the CLI or another tab).'); renderAll(true); }
  }).catch(function () { });
}
setInterval(poll, 5000); document.addEventListener('visibilitychange', poll);

function snap() { return JSON.stringify({ items: S.doc.items, counters: S.doc.counters, milestones: S.doc.milestones }); }
function pushUndo(group) {
  var now = Date.now();
  if (group && S.lastGroup === group && now - S.lastGroupT < 2500) { S.lastGroupT = now; return; }
  S.undo.push(snap()); if (S.undo.length > 80) S.undo.shift(); S.redo = []; S.lastGroup = group || ''; S.lastGroupT = now;
}
function mutate(fn, opt) {
  opt = opt || {};
  pushUndo(opt.group); fn(S.doc);
  scheduleSave(); renderAll(opt.keepDrawer);
}
function restoreSnap(s) { var o = JSON.parse(s); S.doc.items = o.items; S.doc.counters = o.counters; S.doc.milestones = o.milestones; }
function undo() { if (!S.undo.length) return toast('Nothing to undo'); S.redo.push(snap()); restoreSnap(S.undo.pop()); S.lastGroup = ''; scheduleSave(); renderAll(); toast('Undone'); }
function redo() { if (!S.redo.length) return toast('Nothing to redo'); S.undo.push(snap()); restoreSnap(S.redo.pop()); S.lastGroup = ''; scheduleSave(); renderAll(); toast('Redone'); }

function newId(d, area) {
  d.counters = d.counters || {}; var n = d.counters[area] || 0, used = {}; d.items.forEach(function (i) { used[i.id] = 1; });
  do { n++; } while (used[area + '-' + String(n).padStart(3, '0')]);
  d.counters[area] = n; return area + '-' + String(n).padStart(3, '0');
}
function mk(d, o) {
  var day = today(), st = o.status || 'idea';
  return { id: newId(d, o.area), title: o.title, notes: o.notes || '', area: o.area, status: st, priority: o.priority || 'P2', effort: o.effort || 'M', tags: o.tags || [], source: o.source || 'user',
    created: day, updated: day, done: st === 'done' ? day : '', links: o.links || [], public: !!o.public, milestone: o.milestone || '', summary: o.summary || '', reason: '' };
}
function setStatus(it, st, reason) {
  it.status = st; it.updated = today();
  if (st === 'done') { if (!it.done) it.done = today(); } else it.done = '';
  it.reason = st === 'wontdo' ? (reason || it.reason || '') : '';
}
/* move items to a status (and optionally area / position). Asks for a reason for "Won't do". */
function moveItems(ids, st, o) {
  o = o || {};
  var its = ids.map(item).filter(Boolean).filter(function (it) { return it.status !== st || (o.area && it.area !== o.area) || o.refId; });
  if (!its.length) return;
  if (st === 'wontdo' && o.reason === undefined) {
    return ask({ title: "Won't do", label: its.length > 1 ? its.length + ' items: why not?' : its[0].title, ph: 'Reason (shown on the card)', ok: "Won't do", multiline: true }).then(function (v) { if (v !== null) { o.reason = v || 'No reason given'; moveItems(ids, st, o); } });
  }
  var from = its.map(function (i) { return i.status; });
  mutate(function (d) {
    its.forEach(function (it) { setStatus(it, st, o.reason); if (o.area) it.area = o.area; });
    if (o.refId !== undefined) {
      d.items = d.items.filter(function (i) { return its.indexOf(i) < 0; });
      var idx = -1;
      if (o.refId) { var ref = d.items.filter(function (i) { return i.id === o.refId; })[0]; if (ref) idx = d.items.indexOf(ref) + (o.pos === 'after' ? 1 : 0); }
      if (idx < 0) { var last = -1; d.items.forEach(function (i, k) { if (i.status === st && i.area === (o.area || its[0].area)) last = k; }); idx = last >= 0 ? last + 1 : d.items.length; }
      Array.prototype.splice.apply(d.items, [idx, 0].concat(its));
    }
  });
  ids.forEach(function (id) { S.flash[id] = 1; }); setTimeout(function () { S.flash = {}; }, 1600);
  renderMain();
  toast((its.length > 1 ? its.length + ' items' : '"' + clip(its[0].title, 40) + '"') + ' -> ' + ST_LABEL[st], true);
}
function clip(s, n) { return s.length > n ? s.slice(0, n - 1) + '...' : s; }

/* ------------------------------ toast / modal / menu ------------------------------ */
function toast(msg, withUndo) {
  var t = document.createElement('div'); t.className = 'toast'; t.innerHTML = '<span>' + esc(msg) + '</span>' + (withUndo ? '<button>Undo</button>' : '');
  if (withUndo) t.querySelector('button').onclick = function () { undo(); t.remove(); };
  $('#toasts').appendChild(t); setTimeout(function () { t.style.opacity = 0; t.style.transition = 'opacity .3s'; setTimeout(function () { t.remove(); }, 320); }, withUndo ? 5000 : 3200);
}
var lastFocus = null;
function modal(html, setup) {
  lastFocus = document.activeElement;
  var sc = document.createElement('div'); sc.className = 'scrim'; sc.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>'; document.body.appendChild(sc);
  function close(v) { sc.remove(); if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) { } return v; }
  sc.addEventListener('mousedown', function (e) { if (e.target === sc) sc.__done(null); });
  sc.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.stopPropagation(); sc.__done(null); } });
  return new Promise(function (res) { sc.__done = function (v) { close(); res(v); }; setup(sc, sc.__done); });
}
function ask(o) {
  return modal('<h3>' + esc(o.title) + '</h3><label class="lab">' + esc(o.label || '') + (o.multiline ? '<textarea id="mi" style="min-height:70px;font:14px system-ui" placeholder="' + esc(o.ph || '') + '"></textarea>' : '<input id="mi" placeholder="' + esc(o.ph || '') + '" value="' + esc(o.val || '') + '">') + '</label><div class="act"><button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>' + esc(o.ok || 'OK') + '</button></div>', function (sc, done) {
    var i = $('#mi', sc); i.focus(); if (i.select) i.select();
    $('[data-x]', sc).onclick = function () { done(null); }; $('[data-ok]', sc).onclick = function () { done(i.value.trim()); };
    i.onkeydown = function (e) { if (e.key === 'Enter' && (!o.multiline || e.ctrlKey || e.metaKey || !e.shiftKey)) { e.preventDefault(); done(i.value.trim()); } };
  });
}
function confirmBox(title, text, ok) {
  return modal('<h3>' + esc(title) + '</h3><p style="margin:0;color:var(--dim)">' + esc(text) + '</p><div class="act"><button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>' + esc(ok || 'OK') + '</button></div>', function (sc, done) {
    $('[data-ok]', sc).focus(); $('[data-x]', sc).onclick = function () { done(false); }; $('[data-ok]', sc).onclick = function () { done(true); };
  });
}
var menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openMenu(anchor, entries) {
  closeMenu();
  var m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = entries.map(function (e, i) { return e === '-' ? '<hr>' : e.head ? '<div class="h">' + esc(e.head) + '</div>' : '<button role="menuitem" data-i="' + i + '">' + esc(e.label) + '</button>'; }).join('');
  document.body.appendChild(m); menuEl = m;
  var r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + 'px'; m.style.top = Math.min(innerHeight - h - 8, r.bottom + 6) + 'px';
  m.onclick = function (e) { var b = e.target.closest('button'); if (!b) return; var en = entries[+b.dataset.i]; closeMenu(); en.run(); };
  var f = $('button', m); if (f) f.focus();
  m.onkeydown = function (e) { var bs = $$('button', m), k = bs.indexOf(document.activeElement); if (e.key === 'ArrowDown') { e.preventDefault(); bs[(k + 1) % bs.length].focus(); } if (e.key === 'ArrowUp') { e.preventDefault(); bs[(k - 1 + bs.length) % bs.length].focus(); } if (e.key === 'Escape') { closeMenu(); anchor.focus(); } };
}
document.addEventListener('mousedown', function (e) { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });

/* ------------------------------ filters ------------------------------ */
function filtersActive() { return !!(S.q || S.ftag || S.fsrc || S.fms || Object.keys(S.fp).length); }
function match(it) {
  if (Object.keys(S.fp).length && !S.fp[it.priority]) return false;
  if (S.ftag && it.tags.indexOf(S.ftag) < 0) return false;
  if (S.fsrc && it.source !== S.fsrc) return false;
  if (S.fms && it.milestone !== S.fms) return false;
  if (S.q) { var h = (it.id + ' ' + it.title + ' ' + it.notes + ' ' + it.tags.join(' ') + ' ' + it.source + ' ' + it.milestone).toLowerCase(); return S.q.toLowerCase().split(/\s+/).every(function (w) { return h.indexOf(w) >= 0; }); }
  return true;
}
function sorted(list, st) {
  var l = list.slice(), P = { P1: 1, P2: 2, P3: 3 }, E = { S: 1, M: 2, L: 3 };
  if (st === 'done' && S.sort === 'manual') l.sort(function (a, b) { return (b.done || '').localeCompare(a.done || ''); });
  else if (st === 'wontdo') l.sort(function (a, b) { return (b.updated || '').localeCompare(a.updated || ''); });
  else if (S.sort === 'pri') l.sort(function (a, b) { return P[a.priority] - P[b.priority]; });
  else if (S.sort === 'upd') l.sort(function (a, b) { return (b.updated || '').localeCompare(a.updated || ''); });
  else if (S.sort === 'effort') l.sort(function (a, b) { return E[a.effort] - E[b.effort]; });
  else if (S.sort === 'title') l.sort(function (a, b) { return a.title.localeCompare(b.title); });
  return l;
}
function allTags() { var m = {}; S.doc.items.forEach(function (i) { i.tags.forEach(function (t) { m[t] = (m[t] || 0) + 1; }); }); return Object.keys(m).sort(); }
function allSources() { var m = {}; S.doc.items.forEach(function (i) { if (i.source) m[i.source] = 1; }); return Object.keys(m).sort(); }
function msList() { return S.doc.milestones.map(function (m) { return m.id; }); }
function renderTools() {
  var d = S.doc, areaTab = !!areaById(S.tab);
  $('#tools').style.display = '';
  $('#qaArea').innerHTML = d.areas.map(function (a) { return '<option value="' + a.id + '">' + esc(a.short || a.name) + '</option>'; }).join('');
  var qa = areaById(S.tab) ? S.tab : S.lastArea; $('#qaArea').value = qa;
  $('#fp').innerHTML = ['P1', 'P2', 'P3'].map(function (p) { return '<button class="chip" data-p="' + p + '" aria-pressed="' + (!!S.fp[p]) + '">' + p + '</button>'; }).join('');
  function opts(sel, first, list) { var cur = S[sel]; $('#' + sel).innerHTML = '<option value="">' + first + '</option>' + list.map(function (x) { return '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join(''); }
  opts('ftag', 'All tags', allTags()); opts('fsrc', 'All sources', allSources()); opts('fms', 'All milestones', msList());
  $('#sort').value = S.sort; $('#q').value = S.q;
  $('#clearf').hidden = !filtersActive();
  $('#qa').placeholder = 'Quick add to ' + (areaById(qa) ? areaById(qa).short : '') + ' ideas, press Enter  (+ or n to focus)';
  $('#undo').disabled = !S.undo.length; $('#redo').disabled = !S.redo.length;
  $('.filt').style.display = areaTab ? '' : 'none';
}

/* ------------------------------ tabs ------------------------------ */
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
function areaStats(id) {
  var s = { idea: 0, planned: 0, doing: 0, done: 0, wontdo: 0 };
  S.doc.items.forEach(function (i) { if (!id || i.area === id) s[i.status]++; });
  s.conf = s.planned + s.doing + s.done; s.pct = pct(s.done, s.conf); return s;
}
function renderTabs() {
  var h = '<button class="tab" role="tab" data-tab="overview" aria-selected="' + (S.tab === 'overview') + '">Overview</button>';
  S.doc.areas.forEach(function (a) { var s = areaStats(a.id); h += '<button class="tab" role="tab" data-tab="' + a.id + '" aria-selected="' + (S.tab === a.id) + '" title="' + esc(a.desc || '') + '">' + esc(a.name) + '<span class="n" title="open confirmed / ideas">' + (s.planned + s.doing) + '/' + s.idea + '</span><span class="pg"><i style="width:' + s.pct + '%"></i></span></button>'; });
  h += '<button class="tab" role="tab" data-tab="public" aria-selected="' + (S.tab === 'public') + '">Public roadmap</button><button class="tab" role="tab" data-tab="changes" aria-selected="' + (S.tab === 'changes') + '">What changed</button>';
  $('#tabs').innerHTML = h;
}
function selectTab(t) { S.tab = t; store('tab', t); S.sel = {}; $$('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === t); }); renderTools(); renderMain(); renderBulk(); window.scrollTo(0, 0); }
$('#tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) selectTab(b.dataset.tab); });
$('#tabs').addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  var ts = $$('.tab'), k = ts.findIndex(function (b) { return b.dataset.tab === S.tab; }), n = ts[(k + (e.key === 'ArrowRight' ? 1 : ts.length - 1)) % ts.length]; selectTab(n.dataset.tab); n.focus();
});

/* ------------------------------ markdown-lite ------------------------------ */
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(s) {
  var out = '', list = false;
  String(s || '').split('\n').forEach(function (ln) {
    var m = /^\s*[-*]\s+(.*)/.exec(ln);
    if (m) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + inline(m[1]) + '</li>'; return; }
